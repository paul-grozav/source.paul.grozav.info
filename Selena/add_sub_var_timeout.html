<style>
body {

  margin: 10px;

  font-size: 1.2rem;

  width: 100%;

  width: 100%;

  font-size: 2.5rem;
  margin: 15px 20px;

  display: flex;
  flex-wrap: wrap;

  max-width: 500px; /* Widened to fit more buttons nicely */

}
.num-btn {
  font-size: 1.2rem;
  margin: 5px;
  padding: 10px;
  width: 55px;
  height: 55px;
  background-color: #ffb74d;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 4px #e6a742;
  transition: all 0.1s;
}
.num-btn:active {
  box-shadow: 0 0 #e6a742;
  transform: translateY(4px);
}
.num-btn:hover {
  background-color: #ffa726;
}
.num-btn:disabled {
  background-color: #e0e0e0;
  box-shadow: none;
  cursor: not-allowed;
}

  font-size: 1.8rem;
  margin-top: 20px;
  height: 2rem; /* Keeps layout stable when text appears */
}

<header>
  <h1>🧠 Toddler Math</h1>
  <div id="score">✅ 0 | ❌ 0</div>
</header>

<div id="timer-container">
  <div id="timer-bar"></div>
</div>

<div id="question">Preparing...</div>

<div class="button-grid" id="buttons"></div>

<div id="feedback"></div>

<script>
// --- CONFIGURATION ---
const maxLimit = 31;                 // Number limit for questions (10, 30, 50, etc.)
const timeoutSeconds = 10;           // Timer per question (set to 0 or null to disable timer)
const timeoutTriggersWrong = false;   // true: timeout increments wrong count | false: timeout skips question
// ---------------------

let num1, num2, operation, correctAnswer;
let correctCount = 0;
let wrongCount = 0;
let timerId = null;
let timeLeft = 0;

function updateScore() {
  document.getElementById("score").textContent = `✅ ${correctCount} | ❌ ${wrongCount}`;
}

function startTimer() {
  stopTimer(); // Clear any running timer
  if (!timeoutSeconds || timeoutSeconds <= 0) {
    document.getElementById("timer-container").style.display = "none";
    return;
  }

  timeLeft = timeoutSeconds;
  updateTimerUI();

  timerId = setInterval(() => {
    timeLeft--;
    updateTimerUI();

    if (timeLeft <= 0) {
      handleTimeout();
    }
  }, 1000);
}

function stopTimer() {
  if (timerId) {
    clearInterval(timerId);
    timerId = null;
  }
}

function updateTimerUI() {
  const percentage = (timeLeft / timeoutSeconds) * 100;
  const timerBar = document.getElementById("timer-bar");
  timerBar.style.width = `${Math.max(0, percentage)}%`;
}

function handleTimeout() {
  stopTimer();
  disableButtons(true);

  if (timeoutTriggersWrong) {
    wrongCount++;
    document.getElementById("feedback").style.color = "red";
    document.getElementById("feedback").textContent = "⏰ Time's Up! (Marked Wrong)";
    updateScore();
  } else {
    document.getElementById("feedback").style.color = "#ef6c00";
    document.getElementById("feedback").textContent = "⏰ Time's Up! (Skipping)";
  }

  setTimeout(newQuestion, 1500);
}

function disableButtons(disable) {
  const buttons = document.querySelectorAll(".num-btn");
  buttons.forEach(btn => btn.disabled = disable);
}

function newQuestion() {
  stopTimer();
  disableButtons(false);
  operation = Math.random() < 0.5 ? '+' : '-';

  if (operation === '+') {
    // Ensure sum doesn't exceed maxLimit
    num1 = Math.floor(Math.random() * (maxLimit + 1));
    num2 = Math.floor(Math.random() * (maxLimit - num1 + 1));
    correctAnswer = num1 + num2;
  } else {
    // Ensure subtraction doesn't go below 0
    num1 = Math.floor(Math.random() * (maxLimit + 1));
    num2 = Math.floor(Math.random() * (num1 + 1));
    correctAnswer = num1 - num2;
  }

  document.getElementById("question").textContent = `What is ${num1} ${operation} ${num2}?`;
  document.getElementById("feedback").textContent = "";
  
  startTimer();
}

function checkAnswer(answer) {
  stopTimer();

  if (answer === correctAnswer) {
    correctCount++;
    document.getElementById("feedback").style.color = "green";
    document.getElementById("feedback").textContent = "🎉 Correct!";
    updateScore();
    disableButtons(true);
    setTimeout(newQuestion, 1200);
  } else {
    wrongCount++;
    document.getElementById("feedback").style.color = "red";
    document.getElementById("feedback").textContent = "❌ Try Again!";
    updateScore();
    // Resume timer for remaining time if they guess incorrectly
    if (timeoutSeconds > 0 && timeLeft > 0) {
      timerId = setInterval(() => {
        timeLeft--;
        updateTimerUI();
        if (timeLeft <= 0) handleTimeout();
      }, 1000);
    }
  }
}

function createButtons() {
  const buttonsDiv = document.getElementById("buttons");
  buttonsDiv.innerHTML = ""; // Clear existing
  
  for (let i = 0; i <= maxLimit; i++) {
    const btn = document.createElement("button");
    btn.className = "num-btn";
    btn.textContent = i;
    btn.onclick = () => checkAnswer(i);
    buttonsDiv.appendChild(btn);
  }
}

// Initialize the game
createButtons();
updateScore();
newQuestion();
</script>
